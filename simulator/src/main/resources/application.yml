spring:
  application:
    name: simulator
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 5000

bustracker:
  data-dir: data/filtered
  sim:
    speedup: 10
    stagger-sec: 15
    incidents-enabled: true
    cruise-mps: 5.4        # about 19 km/h cruising; with stops and signals the average is near 12 km/h
    dwell-min-sec: 20      # simulated seconds
    dwell-max-sec: 45
    red-prob: 0.45